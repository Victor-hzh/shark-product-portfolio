name: Refresh official prices

on:
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Shark prices and ECB rates
        run: python scripts/sync_official_prices.py
      - name: Commit changed snapshots
        run: |
          git add data/price-snapshot.json data/fx-snapshot.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh official Shark prices and FX reference rates"
            git push
          fi
